<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrador | DCAVA</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0A0A0A;
            --bg-card: #141414;
            --gold: #C6A75E;
            --gold-gradient: linear-gradient(135deg, #B58B35 0%, #E3C174 50%, #B58B35 100%);
            --text-main: #F5F5F5;
            --text-muted: #888888;
            --border: rgba(198, 167, 94, 0.2);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 30%, rgba(198, 167, 94, 0.08) 0%, transparent 70%);
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 40px 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            letter-spacing: 0.12em;
            color: var(--text-main);
            text-transform: uppercase;
            margin-bottom: 8px;
            text-decoration: none;
            display: inline-block;
        }

        .logo span {
            color: var(--gold);
            font-style: italic;
            text-transform: lowercase;
        }

        .badge-admin {
            display: inline-block;
            background: rgba(198, 167, 94, 0.12);
            border: 1px solid var(--gold);
            color: var(--gold);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 24px;
            font-weight: 600;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            background: #1A1A1A;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #FFFFFF;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.25s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(198, 167, 94, 0.2);
            background: #222222;
        }

        .btn-submit {
            width: 100%;
            background: var(--gold-gradient);
            color: #000000;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(198, 167, 94, 0.35);
            filter: brightness(1.1);
        }

        .error-message {
            background: rgba(220, 53, 69, 0.15);
            border: 1px solid rgba(220, 53, 69, 0.4);
            color: #ff6b6b;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: none;
        }

        .back-link {
            display: inline-block;
            margin-top: 24px;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--gold);
        }
    </style>
</head>

<body>
    <div class="login-card">
        <a href="index.html" class="logo">D<span>cava</span></a>
        <div>
            <span class="badge-admin">Acceso Administrador</span>
        </div>

        <div id="errorAlert" class="error-message"></div>

        <form id="adminLoginForm">
            <div class="form-group">
                <label for="adminEmail">Correo Electrónico</label>
                <input type="email" id="adminEmail" placeholder="admin@dcava.cl" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="adminPassword">Contraseña de Administrador</label>
                <input type="password" id="adminPassword" placeholder="••••••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <i class="fa-solid fa-lock" style="margin-right: 8px;"></i> Ingresar al Panel
            </button>
        </form>

        <a href="index.html" class="back-link">
            &larr; Volver a la Tienda Pública
        </a>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js?v=2.3.0"></script>
    <script src="data-manager_v2.js?v=2.4.1"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('adminLoginForm');
            const errorAlert = document.getElementById('errorAlert');
            const submitBtn = document.getElementById('submitBtn');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorAlert.style.display = 'none';
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Autenticando...';

                const email = document.getElementById('adminEmail').value.trim();
                const password = document.getElementById('adminPassword').value;

                try {
                    const result = await DataManager.signIn(email, password);
                    if (result && (result.user || result.session)) {
                        // Guardar token de bypass de mantenimiento para el administrador
                        localStorage.setItem('dcava_admin_bypass', 'true');
                        localStorage.setItem('dcava_admin_email', email);

                        // Redirigir directamente al panel admin
                        window.location.href = 'admin.html';
                    } else {
                        throw new Error('Credenciales de administrador no válidas.');
                    }
                } catch (err) {
                    errorAlert.textContent = err.message || 'Error al iniciar sesión. Verifica tus datos.';
                    errorAlert.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fa-solid fa-lock" style="margin-right: 8px;"></i> Ingresar al Panel';
                }
            });
        });
    </script>
</body>

</html>
