<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra - DCAVA</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Outfit:wght@300;400;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles.css">

    <style>
        /* Estilos específicos para Checkout */
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding-top: 80px;
            /* Header fixed */
        }

        .checkout-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 4rem;
        }

        .checkout-section {
            margin-bottom: 3rem;
        }

        .checkout-title {
            font-family: var(--font-heading);
            font-size: 2rem;
            margin-bottom: 2rem;
            color: var(--gold);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 1rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .form-full {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            letter-spacing: 0.05em;
        }

        .form-control {
            width: 100%;
            padding: 1rem;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            font-family: var(--font-body);
            border-radius: var(--radius);
            transition: var(--transition);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--gold);
            background: #2a2a2a;
        }

        /* Order Summary (Sticky) */
        .order-summary {
            background: var(--bg-card);
            padding: 2.5rem;
            border-radius: var(--radius);
            position: sticky;
            top: 100px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-size: 1rem;
            color: var(--text-muted);
        }

        .summary-total {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 1.5rem;
            color: var(--gold);
            font-family: var(--font-heading);
            font-weight: 700;
        }

        .checkout-items {
            margin-bottom: 2rem;
            max-height: 300px;
            overflow-y: auto;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 1rem;
        }

        .checkout-item {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .item-image {
            width: 60px;
            height: 60px;
            background: var(--bg-sec);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .item-details h4 {
            font-size: 1rem;
            margin-bottom: 0.2rem;
            color: var(--text-main);
        }

        .item-details p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .payment-methods {
            margin-top: 2rem;
        }

        .payment-option {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 1rem;
            border-radius: var(--radius);
            cursor: pointer;
            transition: var(--transition);
        }

        .payment-option:hover,
        .payment-option.active {
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.05);
        }

        .payment-option input {
            accent-color: var(--gold);
        }

        .btn-checkout {
            width: 100%;
            margin-top: 2rem;
            padding: 1.2rem;
            font-size: 1rem;
        }

        /* Mobile */
        @media (max-width: 900px) {
            .checkout-container {
                grid-template-columns: 1fr;
            }

            .order-summary {
                position: static;
                order: -1;
                /* Resumen primero en movil */
                margin-bottom: 3rem;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- Header Simplificado -->
    <header class="header">
        <div class="header-container">
            <a href="index.html" class="logo">
                D<span>CAVA</span>
            </a>
            <a href="index.html" class="nav-link">← Volver al Catálogo</a>
        </div>
    </header>

    <div class="checkout-container">
        <!-- Columna Izquierda: Datos -->
        <div class="checkout-form">
            <h2 class="checkout-title">Datos de Envío</h2>

            <form id="checkoutForm">
                <div class="checkout-section">
                    <h3 style="color:white; margin-bottom:1.5rem; font-size:1.2rem;">Contacto</h3>
                    <div class="form-grid">
                        <div class="form-group form-full">
                            <label>Correo Electrónico</label>
                            <input type="email" id="email" class="form-control" required placeholder="tu@email.com">
                        </div>
                        <div class="form-group form-full"> <!-- Añadido Teléfono -->
                            <label>Teléfono (WhatsApp)</label>
                            <input type="tel" id="phone" class="form-control" required placeholder="+569 1234 5678">
                        </div>
                    </div>
                </div>

                <div class="checkout-section">
                    <h3 style="color:white; margin-bottom:1.5rem; font-size:1.2rem;">Dirección de Entrega</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Nombre</label>
                            <input type="text" id="firstName" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Apellido</label>
                            <input type="text" id="lastName" class="form-control" required>
                        </div>
                        <div class="form-group form-full">
                            <label>Dirección (Calle y Número)</label>
                            <input type="text" id="address" class="form-control" required>
                        </div>
                        <div class="form-group form-full">
                            <label>Departamento / Casa (Opcional)</label>
                            <input type="text" id="apartment" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Comuna</label>
                            <select id="comuna" class="form-control" required>
                                <option value="">Seleccionar...</option>
                                <option value="Las Condes">Las Condes</option>
                                <option value="Vitacura">Vitacura</option>
                                <option value="Lo Barnechea">Lo Barnechea</option>
                                <option value="Providencia">Providencia</option>
                                <option value="Ñuñoa">Ñuñoa</option>
                                <option value="Santiago">Santiago Centro</option>
                                <option value="Otro">Otra (Región Metropolitana)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Región</label>
                            <input type="text" value="Metropolitana" class="form-control" disabled
                                style="opacity: 0.5;">
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <!-- Columna Derecha: Resumen y Pago -->
        <div class="order-summary-wrapper">
            <div class="order-summary">
                <h3 style="color:var(--gold); margin-bottom:1.5rem;">Resumen del Pedido</h3>

                <div id="checkoutItems" class="checkout-items">
                    <!-- Items cargados via JS -->
                </div>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="summarySubtotal">$0</span>
                </div>
                <div class="summary-row">
                    <span>Envío</span>
                    <span id="summaryShipping">Calculando...</span>
                </div>

                <div class="summary-row summary-total">
                    <span>Total</span>
                    <span id="summaryTotal">$0</span>
                </div>

                <div class="payment-methods">
                    <h4 style="color:white; margin-bottom:1rem; font-size:1rem;">Método de Pago</h4>

                    <label class="payment-option active" onclick="selectPayment('whatsapp')">
                        <input type="radio" name="payment" value="whatsapp" checked>
                        <div>
                            <strong>Coordinar por WhatsApp</strong>
                            <p style="font-size:0.8rem; color:var(--text-muted); margin:0;">Confirmar stock y recibir
                                datos de transferencia.</p>
                        </div>
                    </label>

                    <label class="payment-option" onclick="selectPayment('mercadopago')">
                        <input type="radio" name="payment" value="mercadopago">
                        <div>
                            <strong>Mercado Pago</strong>
                            <p style="font-size:0.8rem; color:var(--text-muted); margin:0;">Tarjetas de Crédito, Débito.
                            </p>
                        </div>
                    </label>
                </div>

                <button class="btn btn-primary btn-checkout" id="placeOrderBtn">Confirmar Pedido</button>

                <p style="font-size:0.8rem; color:var(--text-muted); text-align:center; margin-top:1rem;">
                    <i class="fas fa-lock"></i> Compra segura y encriptada.
                </p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="data-manager_v2.js"></script>
    <script>
        // Lógica de Checkout
        let cart = [];
        let shippingCost = 0;

        document.addEventListener('DOMContentLoaded', async () => {
            await loadCart();
            renderOrderSummary();
            loadUserData();

            // Event listener para cambio de comuna (calculo de envío)
            document.getElementById('comuna').addEventListener('change', calculateShipping);

            // Event listener para botón comprar
            document.getElementById('placeOrderBtn').addEventListener('click', handleCheckout);
        });

        async function loadUserData() {
            const userEmail = sessionStorage.getItem('user_email');
            if (userEmail) {
                document.getElementById('email').value = userEmail;
                document.getElementById('email').readOnly = true; // Opcional: bloquear edición si se prefiere

                // Intentar obtener datos del cliente si ya existe
                try {
                    // Inicializar si es necesario (aunque ya debería estar por el script include)
                    if (DataManager.mode === 'supabase' && !DataManager.supabase) DataManager.initSupabase();

                    const cliente = await DataManager.getOrCreateCliente(userEmail, 'Usuario Temporal');

                    if (cliente) {
                        // Pre-llenar nombre si es posible (a veces nombre viene junto)
                        // Si el nombre en DB es distinto a "Usuario Temporal", lo usamos
                        if (cliente.nombre && cliente.nombre !== 'Usuario Temporal') {
                            const parts = cliente.nombre.split(' ');
                            if (parts.length > 0) document.getElementById('firstName').value = parts[0];
                            if (parts.length > 1) document.getElementById('lastName').value = parts.slice(1).join(' ');
                        } else {
                            // Fallback al storage
                            const savedName = sessionStorage.getItem('user_name');
                            if (savedName) {
                                const parts = savedName.split(' ');
                                if (parts.length > 0) document.getElementById('firstName').value = parts[0];
                                if (parts.length > 1) document.getElementById('lastName').value = parts.slice(1).join(' ');
                            }
                        }
                    }
                } catch (e) {
                    console.log('Usuario invitado o error cargando datos cliente:', e);
                }
            }
        }

        async function loadCart() {
            const savedCart = localStorage.getItem('dcava_cart');
            if (savedCart) {
                cart = JSON.parse(savedCart);
            }

            if (cart.length === 0) {
                alert('El carrito está vacío');
                window.location.href = 'index.html';
                return;
            }

            // Validar stock de cada item en base de datos en tiempo real
            try {
                const productos = await DataManager.getProductos();
                let cartUpdated = false;
                let alertMsg = [];

                for (let i = cart.length - 1; i >= 0; i--) {
                    const item = cart[i];
                    const prod = productos.find(p => p.id === item.id);

                    if (!prod) {
                        alertMsg.push(`❌ El producto "${item.nombre}" ya no está disponible en catálogo y ha sido removido.`);
                        cart.splice(i, 1);
                        cartUpdated = true;
                    } else if (prod.stock <= 0) {
                        alertMsg.push(`❌ El producto "${item.nombre}" se ha agotado y ha sido removido.`);
                        cart.splice(i, 1);
                        cartUpdated = true;
                    } else if (item.quantity > prod.stock) {
                        alertMsg.push(`⚠️ El stock disponible de "${item.nombre}" es de ${prod.stock} unidades. Se ajustó tu cantidad.`);
                        item.quantity = prod.stock;
                        item.stock = prod.stock;
                        cartUpdated = true;
                    } else {
                        // Sincronizar el stock máximo por si cambió
                        item.stock = prod.stock;
                    }
                }

                if (cartUpdated) {
                    localStorage.setItem('dcava_cart', JSON.stringify(cart));
                    if (alertMsg.length > 0) alert(alertMsg.join('\n'));
                    if (cart.length === 0) {
                        window.location.href = 'index.html';
                        return;
                    }
                }
            } catch (err) {
                console.error('Error al validar stock en checkout:', err);
            }

            calculateShipping();
        }

        function calculateShipping(e) {
            const subtotal = cart.reduce((sum, item) => sum + (item.precio * item.quantity), 0);
            const comuna = e ? e.target.value : document.getElementById('comuna').value;

            // Lógica de envío
            if (subtotal >= 50000) {
                shippingCost = 0;
            } else {
                if (comuna === 'Otro') {
                    shippingCost = 7000;
                } else if (comuna) {
                    shippingCost = 5000;
                } else {
                    shippingCost = 0; // Aún no seleccionado
                }
            }

            renderOrderSummary();
        }

        function renderOrderSummary() {
            const itemsContainer = document.getElementById('checkoutItems');
            const subtotalEl = document.getElementById('summarySubtotal');
            const shippingEl = document.getElementById('summaryShipping');
            const totalEl = document.getElementById('summaryTotal');

            // Render Items
            itemsContainer.innerHTML = cart.map(item => {
                const icon = item.categoria === 'queso' ? '🧀' : '🥓';
                return `
                    <div class="checkout-item">
                        <div class="item-image">${icon}</div>
                        <div class="item-details">
                            <h4>${item.nombre}</h4>
                            <p>${item.quantity} x $${item.precio.toLocaleString('es-CL')}</p>
                        </div>
                        <div style="margin-left:auto; font-weight:600; color:var(--gold);">
                            $${(item.precio * item.quantity).toLocaleString('es-CL')}
                        </div>
                    </div>
                `;
            }).join('');

            // Totales
            const subtotal = cart.reduce((sum, item) => sum + (item.precio * item.quantity), 0);
            const total = subtotal + shippingCost;

            subtotalEl.textContent = `$${subtotal.toLocaleString('es-CL')}`;

            if (document.getElementById('comuna').value === "") {
                shippingEl.textContent = "Por calcular";
            } else {
                shippingEl.textContent = shippingCost === 0 ? "Gratis" : `$${shippingCost.toLocaleString('es-CL')}`;
            }

            totalEl.textContent = `$${total.toLocaleString('es-CL')}`;
        }

        function selectPayment(method) {
            // Visual selection logic is handled by radio buttons naturally, 
            // but we can add extra styles here if needed.
            document.querySelectorAll('.payment-option').forEach(el => el.classList.remove('active'));
            document.querySelector(`input[value="${method}"]`).parentElement.classList.add('active');
        }

        async function handleCheckout() {
            // Validar formulario
            const form = document.getElementById('checkoutForm');
            if (!form.checkValidity()) {
                alert('Por favor completa todos los campos de envío requeridos.');
                return;
            }

            const placeOrderBtn = document.getElementById('placeOrderBtn');
            placeOrderBtn.disabled = true;
            placeOrderBtn.textContent = 'Procesando...';

            // 0. Validación final de stock antes de registrar la orden en BD
            try {
                const productos = await DataManager.getProductos();
                let stockInvalido = false;
                let errorMsg = [];

                for (const item of cart) {
                    const prod = productos.find(p => p.id === item.id);
                    if (!prod || prod.stock < item.quantity) {
                        stockInvalido = true;
                        const disponible = prod ? prod.stock : 0;
                        errorMsg.push(`❌ "${item.nombre}" ya no cuenta con suficiente stock (Solicitado: ${item.quantity}, Disponible: ${disponible}).`);
                    }
                }

                if (stockInvalido) {
                    alert(`Lo sentimos, el stock de algunos productos cambió mientras realizabas la compra:\n\n${errorMsg.join('\n')}\n\nEl checkout ha sido cancelado para que revises tu compra.`);
                    // Forzar recarga y ajuste de stock en el resumen
                    await loadCart();
                    renderOrderSummary();
                    placeOrderBtn.disabled = false;
                    placeOrderBtn.textContent = 'Confirmar Pedido';
                    return;
                }
            } catch (err) {
                console.error('Error al validar stock en pre-compra:', err);
            }

            const paymentMethod = document.querySelector('input[name="payment"]:checked').value;
            const customer = {
                nombre: document.getElementById('firstName').value + ' ' + document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                telefono: document.getElementById('phone').value,
                direccion: document.getElementById('address').value,
                comuna: document.getElementById('comuna').value,
                total: cart.reduce((sum, item) => sum + (item.precio * item.quantity), 0) + shippingCost
            };

            try {
                // 1. Guardar el pedido en Supabase/Local (donde se descuenta automáticamente el stock)
                const order = await DataManager.createPedido(customer, cart);

                if (paymentMethod === 'whatsapp') {
                    // Generar mensaje de WhatsApp
                    let message = `Hola *DCAVA*, quiero confirmar mi pedido #${order.id || ''}:\n\n`;
                    cart.forEach(item => {
                        message += `▪️ ${item.quantity} x ${item.nombre} ($${(item.precio * item.quantity).toLocaleString('es-CL')})\n`;
                    });

                    message += `\n*Subtotal:* $${(customer.total - shippingCost).toLocaleString('es-CL')}`;
                    message += `\n*Envío:* $${shippingCost.toLocaleString('es-CL')}`;
                    message += `\n*TOTAL A PAGAR:* $${customer.total.toLocaleString('es-CL')}`;

                    message += `\n\n*Mis Datos:*`;
                    message += `\n👤 ${customer.nombre}`;
                    message += `\n📍 ${customer.direccion}, ${customer.comuna}`;
                    message += `\n📧 ${customer.email}`;

                    message += `\n\nQuedo atento a los datos de transferencia. ¡Gracias!`;

                    const dbWhatsapp = await DataManager.getConfig('whatsapp');
                    const cleanWhatsapp = (dbWhatsapp || '56912345678').replace(/\+/g, '').replace(/\s/g, '');
                    const whatsappUrl = `https://wa.me/${cleanWhatsapp}?text=${encodeURIComponent(message)}`;
                    window.open(whatsappUrl, '_blank');

                    alert('¡Pedido registrado! Te hemos redirigido a WhatsApp para coordinar el pago.');
                    localStorage.removeItem('dcava_cart');
                    window.location.href = 'index.html';

                } else if (paymentMethod === 'mercadopago') {
                    // Integración segura de Mercado Pago vía Backend API
                    placeOrderBtn.textContent = 'Generando Pago Seguro...';

                    const apiResponse = await fetch('/api/create-preference', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            items: cart.map(i => ({ id: i.id, quantity: i.quantity })),
                            customer: customer
                        })
                    });

                    const data = await apiResponse.json();

                    if (data.success && (data.init_point || data.sandbox_init_point)) {
                        localStorage.removeItem('dcava_cart');
                        const redirectUrl = data.init_point || data.sandbox_init_point;
                        window.location.href = redirectUrl;
                    } else {
                        throw new Error(data.error || (data.details ? data.details.join('\n') : 'No se pudo generar la preferencia de pago.'));
                    }
                }
            } catch (error) {
                console.error('Error al procesar el pedido:', error);
                alert('Hubo un error al guardar tu pedido. Por favor intenta nuevamente.');
                placeOrderBtn.disabled = false;
                placeOrderBtn.textContent = 'Confirmar Pedido';
            }
        }
    </script>
</body>

</html>
